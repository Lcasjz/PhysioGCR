[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physiogcr"
version = "0.1.0"
description = "Physiological Group-Consistent Recognition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anonymous authors"}]
keywords = ["physiological signals", "time series", "multimodal learning", "robustness", "wearable sensing"]
dependencies = [
  "h5py>=3.8",
  "numpy>=1.23",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.optional-dependencies]
sleep = ["mne>=1.5"]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/OWNER/PhysioGCR"
Documentation = "https://github.com/OWNER/PhysioGCR#readme"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
